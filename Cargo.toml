[workspace]
members = ["crates/arky", "crates/arky-cli", "crates/arky-store"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
authors = ["Eduardo Burgos <eduardo@tixena.com>"]
repository = "https://github.com/tixena/arky"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
# The workspace's own crates: the folder here, the version on crates.io
arky = { version = "0.1.1", path = "crates/arky" }
arky-store = { version = "0.1.1", path = "crates/arky-store" }

# Error handling
thiserror = "2"

# Insertion-ordered map
indexmap = { version = "2.1.0", features = ["serde"] }

# Dates and times, with no clock
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }

# Serialization of the tree, to JSON and back, at any depth
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.48", features = ["unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1.25"

# TypeScript type + Zod schema generation from Rust models
tixschema = { version = "0.2", features = ["chrono", "indexmap"] }

# Binary form, read in place
rkyv = { version = "0.8.17", default-features = false, features = ["std", "bytecheck", "indexmap-2"] }

# The MongoDB driver and the BSON it is built for, for tixschema's MongoDB layer
mongodb = { version = "3.9", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
bson = { version = "3.1", features = ["serde"] }

# Unicode full case folding, for link labels
unicase = "2.10"

# Unicode general categories, for emphasis delimiter runs
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

# The operating system behind a trait, real or in memory
os-shim = "0.2.0"

# The reader and writer traits of os-shim's streams, for the test buckets
futures-io = "0.3.34"

# SHA-256, for the revision of a stored file
sha2 = "0.11"

# Base64, for files written into embeds as data URIs
base64 = "0.23"

# Random GUIDs, the token of a lock a save holds
uuid = { version = "1.13.0", features = ["v4"] }

# Store strings: the URL a bucket store string is, and the percent-encoding of
# the values of its variables
percent-encoding = "2.3.2"
url = "2.5.8"

# Async runtime, for the binary and the tests of the stores
tokio = { version = "1.53.3", default-features = false }

# The command line
clap = { version = "4.4.6", features = ["derive"] }

# Tests of the binary
assert_cmd = "2"
predicates = "3"
tempfile = "3.7.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(store_tests)", "cfg(s3_tests)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"
# Parser and low-level operations require byte indexing and arithmetic.
indexing_slicing = "allow"
arithmetic_side_effects = "allow"
string_slice = "allow"
# Write to String is infallible; discarding the result is intentional.
let_underscore_must_use = "allow"
# Private implementation details do not need doc comments on every field.
missing_docs_in_private_items = "allow"
# Inline annotations are a micro-optimization applied selectively, not globally.
missing_inline_in_public_items = "allow"
# as_conversions are used sparingly and safely for numeric casts.
as_conversions = "allow"
# Tests use unwrap() and expect() for concise assertions.
unwrap_used = "allow"
# Pattern matching through references is idiomatic in filter_map closures.
pattern_type_mismatch = "allow"
# Contradicts rest_pattern_accessible_field; only one of the pair can be enforced.
unneeded_field_pattern = "allow"
# Single-char identifiers are fine in tight scopes (loop vars, closures).
min_ident_chars = "allow"
# Test function naming is clearer with descriptive names, not enforced prefix rules.
redundant_test_prefix = "allow"
# Integer division is used safely for threshold calculations and tests.
integer_division = "allow"
integer_division_remainder_used = "allow"
# HashSet iteration order is irrelevant for set-comparison operations.
iter_over_hash_type = "allow"
# HashSet parameters use the default hasher; generalization adds complexity for no benefit.
implicit_hasher = "allow"
