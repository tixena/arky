[package]
name = "arky-cli"
description = "The arky command line: get and write markdown documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "arky"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[features]
default = ["binary-format", "mongodb", "minio"]
# get -f binary and write -f binary: arky's binary form.
binary-format = ["arky/binary-format", "arky-store/binary-format"]
minio = ["arky-store/minio"]
mongodb = ["arky-store/mongodb"]

[dependencies]
arky.workspace = true
arky-store.workspace = true
clap.workspace = true
os-shim.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
assert_cmd.workspace = true
mongodb.workspace = true
predicates.workspace = true
tempfile.workspace = true
